<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioSphere</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        input[type=range] { appearance: none; -webkit-appearance: none; background: #334155; height: 4px; border-radius: 4px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #3b82f6; cursor: pointer; }
        #player-wrapper { position: absolute; left: -9999px; visibility: hidden; }
    </style>
</head>
<body class="h-screen bg-neutral-950 text-neutral-200 flex overflow-hidden font-sans">
    
    <div id="player-wrapper"><div id="player"></div></div>

    <!-- Login Overlay -->
    <div id="auth-overlay" class="absolute inset-0 z-50 bg-neutral-950 flex flex-col items-center justify-center">
        <h1 class="text-4xl font-bold tracking-tighter mb-2">Audio<span class="text-blue-500">Sphere</span></h1>
        <p class="text-neutral-400 mb-8">Sign in to sync your playlists</p>
        <div id="g_id_onload"
             data-client_id="636902878140-9oetd0mrdg5estia98r53ksb5vdupn8v.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleGoogleResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large"></div>
    </div>

    <!-- Main App UI -->
    <div class="flex flex-1 w-full opacity-0 transition-opacity duration-500" id="app-container">
        <!-- Sidebar Playlist -->
        <aside class="w-80 bg-neutral-900 border-r border-neutral-800 flex flex-col">
            <div class="p-6 border-b border-neutral-800 flex justify-between items-center">
                <h1 class="text-xl font-bold">Audio<span class="text-blue-500">Sphere</span></h1>
                <button onclick="signOut()" class="text-xs text-neutral-500 hover:text-red-400">Sign Out</button>
            </div>
            
            <div class="p-4">
                <div class="flex gap-2">
                    <input type="text" id="newLink" placeholder="Paste YouTube URL" class="w-full bg-neutral-800 text-sm border-none rounded-md px-3 py-2 focus:ring-1 focus:ring-blue-500 outline-none">
                    <button onclick="addLink()" id="addBtn" class="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded-md text-sm transition">+</button>
                </div>
            </div>

            <ul id="playlist" class="flex-1 overflow-y-auto p-2 space-y-1"></ul>
        </aside>

        <!-- Main Player Area -->
        <main class="flex-1 flex flex-col relative bg-gradient-to-b from-neutral-800 to-neutral-950 items-center justify-center p-12">
            
            <div class="w-full max-w-xl aspect-square bg-neutral-900 rounded-3xl shadow-2xl flex flex-col items-center justify-center p-8 border border-neutral-800">
                <!-- Artwork Placeholder -->
                <div class="w-48 h-48 rounded-full bg-gradient-to-tr from-blue-600 to-purple-600 mb-8 shadow-[0_0_40px_rgba(59,130,246,0.3)] animate-pulse" id="artwork"></div>
                
                <h2 id="currentSongTitle" class="text-2xl font-bold text-center truncate w-full mb-8">Select a track</h2>

                <!-- Progress -->
                <div class="w-full flex items-center gap-4 mb-8">
                    <span id="currentTime" class="text-xs font-mono text-neutral-400">0:00</span>
                    <input type="range" id="progressBar" value="0" min="0" max="100" class="w-full">
                    <span id="totalTime" class="text-xs font-mono text-neutral-400">0:00</span>
                </div>

                <!-- Controls -->
                <div class="flex items-center gap-8">
                    <button id="btnRand" onclick="setMode('random')" class="text-neutral-500 hover:text-white transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg></button>
                    <button onclick="prevVideo()" class="text-neutral-300 hover:text-white"><svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M18 6v12l-8.5-6L18 6zm-10 0v12h-2V6h2z"/></svg></button>
                    <button onclick="togglePlay()" class="w-16 h-16 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition shadow-lg" id="playBtn">
                        <svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button onclick="nextVideo()" class="text-neutral-300 hover:text-white"><svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                    <button id="btnSeq" onclick="setMode('sequential')" class="text-blue-500 hover:text-white transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
                </div>
            </div>
            
            <!-- Volume -->
            <div class="absolute bottom-8 right-8 flex items-center gap-3 bg-neutral-900/80 p-3 rounded-full border border-neutral-800">
                <svg class="w-4 h-4 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M17.657 6.343a8 8 0 010 11.314M10 19l-7-7H2V9h5l7-7v17z"></path></svg>
                <input type="range" id="volumeSlider" value="100" min="0" max="100" class="w-24">
            </div>
        </main>
    </div>

    <script>
        const CAS_URL = "http://localhost:4000"; // UPDATE to your CAS deployment
        let accessToken = localStorage.getItem('st-access-token');
        let links = [], mode = 'sequential', currentIndex = -1;
        let player, isPlayerReady = false, progressInterval;

        const playSVG = `<svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
        const pauseSVG = `<svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

        // --- Auth Setup ---
        window.onload = () => {
            if (accessToken) showApp();
        };

        async function handleGoogleResponse(response) {
            try {
                const res = await fetch(`${CAS_URL}/auth/custom/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: response.credential })
                });
                accessToken = res.headers.get('st-access-token'); // Retrieve header from CAS
                if (accessToken) {
                    localStorage.setItem('st-access-token', accessToken);
                    showApp();
                } else {
                    alert("Authentication failed. CAS did not return tokens.");
                }
            } catch (err) { console.error("Login error", err); }
        }

        function signOut() {
            localStorage.removeItem('st-access-token');
            location.reload();
        }

        function showApp() {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('app-container').classList.remove('opacity-0');
            fetchLinks();
            initYouTube();
        }

        function authHeaders() {
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` };
        }

        // --- Data Logic ---
        async function fetchLinks() {
            const res = await fetch('/links', { headers: authHeaders() });
            if (res.status === 401) return signOut();
            links = await res.json();
            renderList();
        }

        async function addLink() {
            const url = document.getElementById('newLink').value;
            if(!url) return;
            document.getElementById('addBtn').textContent = '...';
            await fetch('/add', { method: 'POST', headers: authHeaders(), body: JSON.stringify({url}) });
            document.getElementById('newLink').value = '';
            document.getElementById('addBtn').textContent = '+';
            fetchLinks();
        }

        async function removeLink(url) {
            await fetch('/remove', { method: 'POST', headers: authHeaders(), body: JSON.stringify({url}) });
            fetchLinks();
        }

        function renderList() {
            const ul = document.getElementById('playlist');
            ul.innerHTML = '';
            links.forEach((item, index) => {
                const isActive = currentIndex === index;
                const li = document.createElement('li');
                li.className = `group flex items-center p-3 rounded-lg cursor-pointer transition ${isActive ? 'bg-blue-600/20 text-blue-400' : 'hover:bg-neutral-800 text-neutral-400 hover:text-white'}`;
                
                li.innerHTML = `
                    <div class="flex-1 truncate text-sm mr-2" onclick="playSpecificVideo(${index})">${item.title}</div>
                    <button onclick="removeLink('${item.url}')" class="opacity-0 group-hover:opacity-100 text-neutral-500 hover:text-red-400 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                `;
                ul.appendChild(li);
            });
        }

        // --- YouTube & Player Logic ---
        function initYouTube() {
            if (window.YT) return;
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            document.head.appendChild(tag);
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', { events: { 'onReady': () => { isPlayerReady = true; player.setVolume(100); }, 'onStateChange': onStateChange } });
        }

        function togglePlay() {
            if (!isPlayerReady || !links.length) return;
            if (currentIndex === -1) return nextVideo();
            player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
        }

        function playSpecificVideo(index) {
            if (!isPlayerReady) return;
            currentIndex = index;
            playVideo(links[currentIndex].url);
        }

        function prevVideo() {
            if (!links.length) return;
            currentIndex = mode === 'sequential' ? (currentIndex - 1 + links.length) % links.length : Math.floor(Math.random() * links.length);
            playVideo(links[currentIndex].url);
        }

        function nextVideo() {
            if (!links.length) return;
            currentIndex = mode === 'sequential' ? (currentIndex + 1) % links.length : Math.floor(Math.random() * links.length);
            playVideo(links[currentIndex].url);
        }

        function playVideo(url) {
            const id = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/)?.[2];
            if(id) {
                player.loadVideoById(id);
                document.getElementById('currentSongTitle').textContent = links[currentIndex].title;
                document.getElementById('artwork').classList.remove('animate-pulse');
                renderList();
            }
        }

        function setMode(m) {
            mode = m;
            document.getElementById('btnSeq').className = mode === 'sequential' ? 'text-blue-500' : 'text-neutral-500 hover:text-white transition';
            document.getElementById('btnRand').className = mode === 'random' ? 'text-blue-500' : 'text-neutral-500 hover:text-white transition';
        }

        function onStateChange(event) {
            const btn = document.getElementById('playBtn');
            if (event.data == YT.PlayerState.PLAYING) {
                btn.innerHTML = pauseSVG;
                const duration = player.getDuration();
                document.getElementById('progressBar').max = duration;
                document.getElementById('totalTime').textContent = formatTime(duration);
                clearInterval(progressInterval);
                progressInterval = setInterval(updateProgress, 500);
            } else {
                clearInterval(progressInterval);
                if (event.data == YT.PlayerState.PAUSED) btn.innerHTML = playSVG;
                if (event.data == YT.PlayerState.ENDED) nextVideo();
            }
        }

        function updateProgress() {
            if (player?.getCurrentTime) {
                const ct = player.getCurrentTime();
                document.getElementById('progressBar').value = ct;
                document.getElementById('currentTime').textContent = formatTime(ct);
            }
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        document.getElementById('progressBar').addEventListener('input', e => {
            if (player?.seekTo) { player.seekTo(e.target.value, true); document.getElementById('currentTime').textContent = formatTime(e.target.value); }
        });
        document.getElementById('volumeSlider').addEventListener('input', e => { if (player?.setVolume) player.setVolume(e.target.value); });
    </script>
</body>
</html>
